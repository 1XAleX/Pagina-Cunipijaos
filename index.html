<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CUNIPIJAOS · Unidad de Producción Bio-Industrial</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #EAEDEC;
    --surface: #FFFFFF;
    --surface-2: #F1F4F3;
    --border: #D4DBD8;
    --text: #1C2724;
    --muted: #5B6864;
    --primary: #163A2E;
    --primary-dark: #0D2620;
    --primary-light: #3E6152;
    --accent: #C9971E;
    --info: #2A6CB0;
    --warn: #C9971E;
    --danger: #B23A32;
    --good: #163A2E;
    --primary-soft: #DCE6E1;
    --good-soft: #DCE6E1;
    --accent-soft: #F3E7CA;
    --info-soft: #DCE7F3;
    --warn-soft: #F3E7CA;
    --danger-soft: #F4DAD6;
  }
  *{box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.font-display{ font-family:'Space Grotesk', sans-serif; letter-spacing:-.01em; }
  .mono{ font-family:'IBM Plex Mono', monospace; }

  /* ---- Layout shell ---- */
  .app-header{
    background:var(--primary-dark);
    color:#EFE9DC;
    border-bottom:1px solid #1E2E20;
  }
  .app-header .subtitle{ color:#C9D6C6; }
  .ghost-btn{
    border:1px solid rgba(239,233,220,.35);
    color:#EFE9DC;
    background:transparent;
    font-size:.8rem;
    padding:.4rem .7rem;
    border-radius:5px;
    transition:background .15s ease;
  }
  .ghost-btn:hover{ background:rgba(239,233,220,.12); }

  /* ---- Folder-style tabs ---- */
  .tabbar{ display:flex; gap:.25rem; padding:0 1.25rem; border-bottom:1px solid var(--border); background:var(--bg); }
  .tab-btn{
    font-family:'IBM Plex Sans';
    font-size:.92rem;
    padding:.65rem 1.15rem;
    border:1px solid var(--border);
    border-bottom:none;
    border-radius:7px 7px 0 0;
    background:var(--surface-2);
    color:var(--muted);
    position:relative; top:1px;
    cursor:pointer;
  }
  .tab-btn.active{
    background:var(--surface);
    color:var(--primary-dark);
    font-weight:600;
    border-color:var(--border);
    border-bottom:1px solid var(--surface);
  }
  .tab-panel-wrap{
    background:var(--surface);
    border:1px solid var(--border);
    border-top:none;
    border-radius:0 0 8px 8px;
    padding:1.5rem;
    min-height:60vh;
  }

  /* ---- Buttons ---- */
  .btn{
    font-family:'IBM Plex Sans';
    font-weight:500;
    font-size:.9rem;
    padding:.55rem 1rem;
    border-radius:6px;
    cursor:pointer;
    border:1px solid transparent;
    transition:filter .15s ease;
  }
  .btn:hover{ filter:brightness(1.08); }
  .btn-primary{ background:var(--primary); color:#F6F3EB; }
  .btn-outline{ background:transparent; border:1px solid var(--border); color:var(--text); }
  .btn-danger{ background:transparent; border:1px solid var(--danger); color:var(--danger); }
  .btn-sm{ padding:.3rem .6rem; font-size:.78rem; }

  /* ---- Tables ---- */
  table{ width:100%; border-collapse:collapse; font-size:.88rem; }
  thead th{
    text-align:left; font-weight:600; color:var(--muted);
    font-size:.75rem; letter-spacing:.02em;
    padding:.5rem .6rem; border-bottom:1px solid var(--border);
  }
  tbody td{ padding:.55rem .6rem; border-bottom:1px solid var(--border); vertical-align:middle; }
  tbody tr:hover{ background:var(--surface-2); }
  .id-cell{ font-family:'IBM Plex Mono'; font-size:.82rem; color:var(--primary-dark); }

  /* ---- Badges ---- */
  .badge{
    display:inline-flex; align-items:center; gap:.4rem;
    font-size:.74rem; padding:.2rem .55rem;
    border:1px solid var(--border); border-radius:4px; white-space:nowrap;
  }
  .badge .dot{ width:6px; height:6px; border-radius:50%; flex:none; }
  .b-primary .dot{ background:var(--primary); }
  .b-good .dot{ background:var(--good); }
  .b-warn .dot{ background:var(--warn); }
  .b-danger .dot{ background:var(--danger); }
  .b-muted .dot{ background:#9C927A; }

  /* ---- Alert rows ---- */
  .alert-row{
    display:flex; align-items:flex-start; gap:.75rem;
    padding:.6rem .7rem; border:1px solid var(--border); border-left-width:4px;
    border-radius:5px; background:var(--surface); margin-bottom:.5rem;
  }
  .alert-row.atrasado{ border-left-color:var(--danger); }
  .alert-row.hoy{ border-left-color:var(--warn); }
  .alert-row.proximo{ border-left-color:var(--primary); }

  /* ---- Forms ---- */
  label{ font-size:.8rem; color:var(--muted); display:block; margin-bottom:.25rem; }
  input, select, textarea{
    width:100%; border:1px solid var(--border); border-radius:5px;
    padding:.5rem .6rem; font-size:.88rem; background:#fff; color:var(--text);
    font-family:'IBM Plex Sans';
  }
  input:focus, select:focus, textarea:focus{ outline:2px solid var(--primary-light); outline-offset:1px; }
  .field{ margin-bottom:.9rem; }

  /* ---- Modal ---- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(20,18,12,.45);
    display:flex; align-items:flex-start; justify-content:center;
    padding:3vh 1rem; overflow-y:auto; z-index:50;
  }
  .modal-box{
    background:var(--surface); border-radius:10px; border:1px solid var(--border);
    width:100%; max-width:720px; padding:1.5rem 1.6rem 1.75rem;
    box-shadow:0 20px 45px rgba(0,0,0,.18);
  }
  .modal-box.wide{ max-width:920px; }
  .section-title{
    font-family:'Fraunces'; font-size:1.02rem; color:var(--primary-dark);
    border-bottom:1px solid var(--border); padding-bottom:.4rem; margin:1.3rem 0 .8rem;
  }
  .section-title:first-of-type{ margin-top:0; }

  .warn-banner{
    border:1px solid var(--danger); background:#F7E9E5; color:#7A2A1D;
    padding:.6rem .8rem; border-radius:6px; font-size:.85rem; margin-bottom:1rem;
    display:flex; gap:.5rem; align-items:flex-start;
  }

  .readonly-pill{
    font-family:'IBM Plex Mono'; font-size:.82rem; background:var(--surface-2);
    border:1px solid var(--border); border-radius:5px; padding:.5rem .6rem; color:var(--muted);
  }

  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-thumb{ background:#CDC2A6; border-radius:6px; }

  .toast{
    position:fixed; bottom:1.25rem; right:1.25rem; background:var(--primary-dark);
    color:#F6F3EB; padding:.65rem 1rem; border-radius:6px; font-size:.85rem;
    box-shadow:0 8px 24px rgba(0,0,0,.25); z-index:100; opacity:0; transform:translateY(8px);
    transition:all .25s ease; pointer-events:none;
  }
  .toast.show{ opacity:1; transform:translateY(0); }

  /* ---- Dashboard vivo ---- */
  .kpi-card{
    display:flex; align-items:center; gap:.75rem;
    border:1px solid var(--border); border-radius:8px; padding:.85rem;
    background:var(--surface);
  }
  .kpi-icon{
    width:38px; height:38px; border-radius:10px; flex:none;
    display:flex; align-items:center; justify-content:center;
  }
  .kpi-value{ font-family:'Fraunces'; font-size:1.4rem; line-height:1.1; color:var(--text); }
  .kpi-label{ font-size:.72rem; color:var(--muted); margin-top:.1rem; }

  .agenda-strip{ display:flex; gap:.5rem; overflow-x:auto; padding-bottom:.25rem; }
  .agenda-day{
    flex:1; min-width:72px; text-align:center; border:1px solid var(--border);
    border-radius:8px; padding:.55rem .3rem; cursor:pointer; background:var(--surface);
    transition:border-color .15s ease, background .15s ease;
  }
  .agenda-day:hover{ border-color:var(--primary-light); }
  .agenda-day.is-today{ background:var(--primary-soft); border-color:var(--primary); }
  .agenda-day.is-selected{ box-shadow:0 0 0 2px var(--primary-dark) inset; }
  .agenda-day .wd{ font-size:.68rem; color:var(--muted); text-transform:capitalize; }
  .agenda-day .num{ font-family:'Fraunces'; font-size:1.15rem; color:var(--text); }
  .agenda-count{
    display:inline-flex; align-items:center; justify-content:center;
    min-width:18px; height:18px; border-radius:9px; font-size:.68rem; margin-top:.25rem;
    background:var(--danger); color:#fff; padding:0 .3rem;
  }
  .agenda-count.ok{ background:var(--primary-light); }

  .section-header{
    display:flex; align-items:center; gap:.5rem; margin-bottom:.85rem;
  }
  .section-header .ic{ color:var(--primary-dark); }
  .section-header h3{ font-family:'Fraunces'; font-size:1.05rem; color:var(--primary-dark); margin:0; }

  .distro-bar{ display:flex; height:14px; border-radius:7px; overflow:hidden; border:1px solid var(--border); }
  .distro-legend{ display:flex; flex-wrap:wrap; gap:.9rem; margin-top:.6rem; font-size:.78rem; color:var(--muted); }
  .distro-legend .dot{ width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:.3rem; }

  .empty-ok{
    display:flex; align-items:center; gap:.6rem; padding:.75rem .9rem;
    border:1px dashed var(--primary-light); border-radius:8px; background:var(--primary-soft);
    color:var(--primary-dark); font-size:.9rem; margin-bottom:1rem;
  }

  @media (max-width:640px){
    .tabbar{ overflow-x:auto; }
    .modal-box{ padding:1.1rem; }
  }

  .qr-label{ padding:.5rem; }
  @media print{
    body.printing-label *{ visibility:hidden; }
    body.printing-label .qr-label, body.printing-label .qr-label *{ visibility:visible; }
    body.printing-label .qr-label{ position:fixed; top:0; left:0; width:100%; padding-top:2rem; }
  }
</style>
</head>
<body>

<header class="app-header px-5 py-4 flex items-center justify-between flex-wrap gap-3">
  <div>
    <h1 class="text-xl font-semibold">CUNIPIJAOS</h1>
    <div class="subtitle text-xs">Unidad de Producción Bio-Industrial · Centro de Selección Genética</div>
  </div>
  <div class="flex items-center gap-3 flex-wrap">
    <span class="text-xs subtitle" id="hoyLabel"></span>
    <span class="text-xs" id="nubeEstado" style="color:#C9D6C6;">☁ Conectando…</span>
    <button class="ghost-btn" onclick="abrirConfiguracion()">Configuración</button>
    <button class="ghost-btn" onclick="exportarDatos()">Exportar respaldo</button>
    <label class="ghost-btn cursor-pointer">
      Importar respaldo
      <input type="file" accept="application/json" class="hidden" onchange="importarDatos(event)">
    </label>
  </div>
</header>

<nav class="tabbar mt-4" id="tabbar">
  <button class="tab-btn" data-tab="panel" onclick="cambiarTab('panel')">Resumen Operativo</button>
  <button class="tab-btn" data-tab="ejemplares" onclick="cambiarTab('ejemplares')">Banco Genético</button>
  <button class="tab-btn" data-tab="lotes" onclick="cambiarTab('lotes')">Trazabilidad y Sincronización</button>
  <button class="tab-btn" data-tab="estadisticas" onclick="cambiarTab('estadisticas')">Control Estadístico (CEP)</button>
</nav>

<main class="px-1 sm:px-0 max-w-6xl mx-auto pb-16">

  <div class="tab-panel-wrap">
    <section id="tab-panel"></section>
    <section id="tab-ejemplares" class="hidden"></section>
    <section id="tab-lotes" class="hidden"></section>
    <section id="tab-estadisticas" class="hidden"></section>
  </div>
</main>

<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   ESTADO Y PERSISTENCIA
   ========================================================= */
const LS_KEY = 'cunipijaos_v1';
let DB = { conejos: [], lotes: [] };

function datosPorDefecto(){
  return {
    config: {
      capacidadJaulasCebo: 40,
      umbralAlertaPct: 85,
      lat: 5.5353,
      lon: -73.3678,
      ubicacionLabel: 'Tunja, Boyacá',
    },
    conejos: [
      { id_conejo:'CP_001', sexo:'MACHO',  raza:'MIX HOLANDES', id_padre:null, id_madre:null,   estado_disponibilidad:'BAJA',   estado_productivo:'BAJA_VENTA', categoria_uso:'CEBO' },
      { id_conejo:'CP_002', sexo:'MACHO',  raza:'CAL*NZ',       id_padre:null, id_madre:null,   estado_disponibilidad:'ACTIVO', estado_productivo:'LIBRE_DISPONIBLE', categoria_uso:'REPRODUCTOR' },
      { id_conejo:'CP_003', sexo:'MACHO',  raza:'CAL*NZ',       id_padre:null, id_madre:null,   estado_disponibilidad:'ACTIVO', estado_productivo:'LIBRE_DESARROLLO', categoria_uso:'REEMPLAZO' },
      { id_conejo:'CP_004', sexo:'HEMBRA', raza:'MIX',          id_padre:null, id_madre:null,   estado_disponibilidad:'ACTIVO', estado_productivo:'MATERNIDAD_LACTANTE', categoria_uso:'REPRODUCTOR' },
      { id_conejo:'CP_005', sexo:'HEMBRA', raza:'NZ',           id_padre:null, id_madre:null,   estado_disponibilidad:'ACTIVO', estado_productivo:'LIBRE_DISPONIBLE', categoria_uso:'REPRODUCTOR' },
      { id_conejo:'CP_006', sexo:'HEMBRA', raza:'MIX',          id_padre:null, id_madre:'CP_004', estado_disponibilidad:'ACTIVO', estado_productivo:'LIBRE_DISPONIBLE', categoria_uso:'REPRODUCTOR' },
      { id_conejo:'CP_007', sexo:'HEMBRA', raza:'F1 (NZ*CAL)',  id_padre:null, id_madre:null,   estado_disponibilidad:'ACTIVO', estado_productivo:'GESTANTE_CONFIRMADA', categoria_uso:'REPRODUCTOR' },
    ],
    lotes: [
      {
        id_lote:'L_000', id_macho:'DESCONOCIDO', id_hembra:'CP_004',
        fecha_monta:'2026-07-24', fecha_flushing_luminico:null,
        resultado_palpacion:'POSITIVO',
        nacidos_vivos:null, nacidos_muertos:null,
        fecha_real_parto:null, fecha_real_destete:null,
        cantidad_destetados:null, mortalidad_lactancia:null,
        nido_armado:{hecho:false, fecha:null},
        comentario:'Cruce no deseado, probable venta para carne.',
        unidad_peso:'kg', pesajes:{ p1:{}, p2:{}, p3:{}, p4:{}, p5:{} },
      },
      {
        id_lote:'L_001', id_macho:'CP_002', id_hembra:'CP_007',
        fecha_monta:'2026-08-09', fecha_flushing_luminico:'2026-08-02',
        resultado_palpacion:'POSITIVO',
        nacidos_vivos:null, nacidos_muertos:null,
        fecha_real_parto:null, fecha_real_destete:null,
        cantidad_destetados:null, mortalidad_lactancia:null,
        nido_armado:{hecho:false, fecha:null},
        comentario:'Primer cruce planeado, F1 casi perfecto.',
        unidad_peso:'kg', pesajes:{ p1:{}, p2:{}, p3:{}, p4:{}, p5:{} },
      },
      {
        id_lote:'L_002', id_macho:'CP_002', id_hembra:'CP_006',
        fecha_monta:'2026-09-06', fecha_flushing_luminico:'2026-08-30',
        resultado_palpacion:'POSITIVO',
        nacidos_vivos:null, nacidos_muertos:null,
        fecha_real_parto:null, fecha_real_destete:null,
        cantidad_destetados:null, mortalidad_lactancia:null,
        nido_armado:{hecho:false, fecha:null},
        comentario:'',
        unidad_peso:'kg', pesajes:{ p1:{}, p2:{}, p3:{}, p4:{}, p5:{} },
      },
    ],
  };
}

function normalizarDB(){
  DB.conejos = DB.conejos || [];
  DB.lotes = DB.lotes || [];
  DB.config = DB.config || { capacidadJaulasCebo:40, umbralAlertaPct:85, lat:5.5353, lon:-73.3678, ubicacionLabel:'Tunja, Boyacá' };
  DB.lotes.forEach(l=>{
    if(!l.pesajes) l.pesajes = { p1:{}, p2:{}, p3:{}, p4:{}, p5:{} };
    if(!l.nido_armado) l.nido_armado = { hecho:false, fecha:null };
  });
  DB.conejos.forEach(c=>{ if(!c.categoria_uso) c.categoria_uso = 'REPRODUCTOR'; });
}

function cargarDB(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){
      DB = JSON.parse(raw);
    } else {
      DB = datosPorDefecto();
      guardarDB();
    }
  }catch(e){
    console.error('Error leyendo localStorage', e);
    DB = datosPorDefecto();
  }
  normalizarDB();
}
function guardarDB(){
  localStorage.setItem(LS_KEY, JSON.stringify(DB));
  if(window.CuniNube && window.CuniNube.listo){
    window.CuniNube.subir(DB);
  }
}

// Puente para el módulo de Firebase (los módulos no comparten el scope del script clásico)
window.obtenerDBActual = function(){ return DB; };
window.reemplazarDBDesdeNube = function(nuevaData){
  DB = nuevaData;
  normalizarDB();
  localStorage.setItem(LS_KEY, JSON.stringify(DB));
  renderTodo();
};

function abrirConfiguracion(){
  const cfg = DB.config;
  const html = `
    <div class="modal-overlay" onclick="if(event.target===this) cerrarModal()">
      <div class="modal-box">
        <h3 class="font-display text-xl mb-4">Configuración operativa</h3>
        <div class="field">
          <label>Capacidad total de jaulas de cebo</label>
          <input id="cfg_capacidad" type="number" min="1" value="${cfg.capacidadJaulasCebo}">
        </div>
        <div class="field">
          <label>Umbral de alerta de ocupación (%)</label>
          <input id="cfg_umbral" type="number" min="1" max="100" value="${cfg.umbralAlertaPct}">
        </div>
        <div class="section-title">Monitoreo ambiental</div>
        <div class="grid sm:grid-cols-2 gap-x-4">
          <div class="field">
            <label>Etiqueta de ubicación</label>
            <input id="cfg_label" type="text" value="${cfg.ubicacionLabel}">
          </div>
          <div class="field"></div>
          <div class="field">
            <label>Latitud</label>
            <input id="cfg_lat" type="number" step="0.0001" value="${cfg.lat}">
          </div>
          <div class="field">
            <label>Longitud</label>
            <input id="cfg_lon" type="number" step="0.0001" value="${cfg.lon}">
          </div>
        </div>
        <p class="text-xs" style="color:var(--muted)">La CDO y la eficiencia de bloque son estimaciones calculadas a partir de tus propios registros, no lecturas de sensores instalados. El clima se toma de un servicio meteorológico externo (referencia exterior de la zona, no del interior del galpón).</p>
        <div class="flex justify-end gap-2 mt-4">
          <button class="btn btn-outline" onclick="cerrarModal()">Cancelar</button>
          <button class="btn btn-primary" onclick="guardarConfiguracion()">Guardar</button>
        </div>
      </div>
    </div>`;
  document.getElementById('modalRoot').innerHTML = html;
}

function guardarConfiguracion(){
  DB.config.capacidadJaulasCebo = Number(document.getElementById('cfg_capacidad').value) || DB.config.capacidadJaulasCebo;
  DB.config.umbralAlertaPct = Number(document.getElementById('cfg_umbral').value) || DB.config.umbralAlertaPct;
  DB.config.ubicacionLabel = document.getElementById('cfg_label').value.trim() || DB.config.ubicacionLabel;
  DB.config.lat = Number(document.getElementById('cfg_lat').value);
  DB.config.lon = Number(document.getElementById('cfg_lon').value);
  guardarDB();
  cerrarModal();
  cargarClima();
  renderPanel();
  toast('Configuración guardada');
}


function exportarDatos(){
  const blob = new Blob([JSON.stringify(DB, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'cunipijaos_respaldo_' + todayStr() + '.json';
  a.click();
  URL.revokeObjectURL(url);
  toast('Respaldo descargado');
}
function importarDatos(ev){
  const file = ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const data = JSON.parse(e.target.result);
      if(!confirm('Esto reemplazará todos los datos actuales por los del archivo. ¿Continuar?')) return;
      DB = { conejos: data.conejos || [], lotes: data.lotes || [] };
      DB.lotes.forEach(l=>{ if(!l.pesajes) l.pesajes = { p1:{}, p2:{}, p3:{}, p4:{}, p5:{} }; });
      guardarDB();
      renderTodo();
      toast('Datos importados correctamente');
    }catch(err){
      alert('El archivo no es un respaldo válido de CUNIPIJAOS.');
    }
  };
  reader.readAsText(file);
  ev.target.value = '';
}

/* =========================================================
   UTILIDADES DE FECHA
   ========================================================= */
function todayStr(){ return new Date().toISOString().slice(0,10); }
function addDays(dateStr, days){
  if(!dateStr) return null;
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0,10);
}
function fmt(dateStr){
  if(!dateStr) return '—';
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('es-CO', {day:'2-digit', month:'short', year:'numeric'});
}
function classifyDate(dateStr){
  if(!dateStr) return null;
  const t = todayStr();
  if(dateStr < t) return 'atrasado';
  if(dateStr === t) return 'hoy';
  if(dateStr <= addDays(t,7)) return 'proximo';
  return null;
}
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), 2200);
}

function ic(name, size){
  size = size || 18;
  const paths = {
    macho: '<circle cx="9" cy="15" r="5.5"/><path d="M13 10.5L19 4.5M19 4.5h-5M19 4.5v5"/>',

function getConejo(id){ return DB.conejos.find(c=>c.id_conejo === id); }
function machosActivos(){ return DB.conejos.filter(c=>c.sexo==='MACHO' && c.estado_disponibilidad==='ACTIVO'); }
function hembrasActivas(){ return DB.conejos.filter(c=>c.sexo==='HEMBRA' && c.estado_disponibilidad==='ACTIVO'); }

function checkConsanguinidad(machoId, hembraId){
  const macho = getConejo(machoId), hembra = getConejo(hembraId);
  if(!macho || !hembra) return false;
  const padresM = [macho.id_padre, macho.id_madre].filter(Boolean);
  const padresH = [hembra.id_padre, hembra.id_madre].filter(Boolean);
  const comparten = padresM.some(id => padresH.includes(id));
  const esDirecto = padresM.includes(hembra.id_conejo) || padresH.includes(macho.id_conejo);
  return comparten || esDirecto;
}

function nextLoteId(){
  const nums = DB.lotes.map(l=>{ const m = (l.id_lote||'').match(/(\d+)$/); return m ? parseInt(m[1]) : 0; });
  const max = nums.length ? Math.max(...nums) : 0;
  return 'L_' + String(max+1).padStart(3,'0');
}

function fechasLote(l){
  const fPalpacion = addDays(l.fecha_monta, 14);
  const fNido = addDays(l.fecha_monta, 28);
  const fPartoProbable = addDays(l.fecha_monta, 31);
  const baseParto = l.fecha_real_parto || fPartoProbable;
  const fDesteteProgramado = l.fecha_real_parto ? addDays(l.fecha_real_parto, 35) : addDays(l.fecha_monta, 66);
  const pesajes = {
    p1: { n:1, label:'Destete', fecha: addDays(baseParto, 35) },
    p2: { n:2, label:'Segregación de sexos', fecha: addDays(baseParto, 56) },
    p3: { n:3, label:'Control post-traslado', fecha: addDays(baseParto, 70) },
    p4: { n:4, label:'Desaceleración de crecimiento', fecha: addDays(baseParto, 84) },
    p5: { n:5, label:'Certificación del lote', fecha: addDays(baseParto, 98) },
  };
  return { fPalpacion, fNido, fPartoProbable, baseParto, fDesteteProgramado, pesajes };
}

function estadoLote(l){
  if(l.fecha_real_destete) return {label:'Destetado', color:'muted'};
  if(l.fecha_real_parto) return {label:'En lactancia', color:'primary'};
  if(l.resultado_palpacion === 'POSITIVO') return {label:'Gestante confirmada', color:'good'};
  if(l.resultado_palpacion === 'NEGATIVO') return {label:'Monta fallida', color:'danger'};
  if(l.resultado_palpacion === 'DUDOSO') return {label:'Palpación dudosa', color:'warn'};
  return {label:'En espera de palpación', color:'muted'};
}

function generarAlertas(){
  const out = { palpacion:[], nido:[], parto:[], destete:[], pesaje:[] };
  DB.lotes.forEach(l=>{
    const f = fechasLote(l);

    if(!l.resultado_palpacion || l.resultado_palpacion==='PENDIENTE'){
      const cls = classifyDate(f.fPalpacion);
      if(cls) out.palpacion.push({lote:l, fecha:f.fPalpacion, cls});
    }
    if(l.resultado_palpacion !== 'NEGATIVO' && !l.fecha_real_parto){
      if(!(l.nido_armado && l.nido_armado.hecho)){
        const cls = classifyDate(f.fNido);
        if(cls) out.nido.push({lote:l, fecha:f.fNido, cls});
      }
      const cls2 = classifyDate(f.fPartoProbable);
      if(cls2) out.parto.push({lote:l, fecha:f.fPartoProbable, cls:cls2});
    }
    if(l.fecha_real_parto && !l.fecha_real_destete){
      const cls = classifyDate(f.fDesteteProgramado);
      if(cls) out.destete.push({lote:l, fecha:f.fDesteteProgramado, cls});
    }
    Object.values(f.pesajes).forEach(p=>{
      const registro = l.pesajes[('p'+p.n)] || {};
      const hecho = registro.cantidad || registro.peso;
      if(!hecho){
        const cls = classifyDate(p.fecha);
        if(cls) out.pesaje.push({lote:l, fecha:p.fecha, cls, n:p.n, label:p.label});
      }
    });
  });
  Object.values(out).forEach(arr=>arr.sort((a,b)=>a.fecha.localeCompare(b.fecha)));
  return out;
}

function saludo(){
  const h = new Date().getHours();
  if(h < 12) return 'Buenos días';
  if(h < 19) return 'Buenas tardes';
  return 'Buenas noches';
}

function agendaSemana(alertasPlanas){
  const dias = [];
  for(let i=0;i<7;i++){
    const fecha = addDays(todayStr(), i);
    const d = new Date(fecha+'T00:00:00');
    let count = alertasPlanas.filter(x=>x.fecha===fecha).length;
    if(i===0) count += alertasPlanas.filter(x=>x.fecha < fecha).length; // atrasados se acumulan en "hoy"
    dias.push({ fecha, wd:d.toLocaleDateString('es-CO',{weekday:'short'}), num:d.getDate(), esHoy:i===0, count });
  }
  return dias;
}

function distribucionBancoHtml(){
  const activos = DB.conejos.filter(c=>c.estado_disponibilidad==='ACTIVO');
  const machos = activos.filter(c=>c.sexo==='MACHO').length;
  const hembras = activos.filter(c=>c.sexo==='HEMBRA').length;
  const bajas = DB.conejos.filter(c=>c.estado_disponibilidad==='BAJA').length;
  const total = machos + hembras + bajas || 1;

  const segMacho = (machos/total*100);
  const segHembra = (hembras/total*100);
  const segBaja = (bajas/total*100);

  const conteoEstados = {};
  activos.forEach(c=>{ conteoEstados[c.estado_productivo] = (conteoEstados[c.estado_productivo]||0)+1; });
  const maxEstado = Math.max(1, ...Object.values(conteoEstados));

  const barrasEstado = Object.entries(conteoEstados)
    .sort((a,b)=>b[1]-a[1])
    .map(([k,v])=>barraHtml(labelEstadoProductivo(k), v, maxEstado, ''))
    .join('');

  return `
    <div class="mb-2">
      <div class="distro-bar">
        <div style="width:${segMacho}%; background:var(--info)"></div>
        <div style="width:${segHembra}%; background:var(--accent)"></div>
        <div style="width:${segBaja}%; background:#B9AF95"></div>
      </div>
      <div class="distro-legend">
        <span><span class="dot" style="background:var(--info)"></span>Machos activos (${machos})</span>
        <span><span class="dot" style="background:var(--accent)"></span>Hembras activas (${hembras})</span>
        <span><span class="dot" style="background:#B9AF95"></span>Baja (${bajas})</span>
      </div>
    </div>
    <div class="mt-4">${barrasEstado || `<div class="text-sm" style="color:var(--muted)">Sin ejemplares activos registrados.</div>`}</div>
  `;
}

let climaActual = { estado:'cargando' };
async function cargarClima(){
  climaActual = { estado:'cargando' };
  if(document.getElementById('climaBox')) renderPanel();
  try{
    const { lat, lon } = DB.config;
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,wind_speed_10m&wind_speed_unit=ms`;
    const res = await fetch(url);
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    climaActual = { estado:'ok', temp:data.current.temperature_2m, hum:data.current.relative_humidity_2m, viento:data.current.wind_speed_10m };
  }catch(e){
    climaActual = { estado:'error' };
  }
  renderPanel();
}

  if(climaActual.estado==='cargando'){

function calcularCDO(){
  const hoy = todayStr();
  const desde = addDays(hoy, -90);
  let ocupacion = 0;
  DB.lotes.forEach(l=>{
    if(l.fecha_real_destete && l.fecha_real_destete >= desde && l.fecha_real_destete <= hoy){
      ocupacion += l.cantidad_destetados || 0;
    }
  });
  const capacidad = DB.config.capacidadJaulasCebo || 1;
  const pct = (ocupacion/capacidad*100);
  const umbral = DB.config.umbralAlertaPct || 85;
  let estado = 'verde';
  if(pct >= umbral) estado = 'rojo';
  else if(pct >= umbral*0.75) estado = 'amarillo';
  return { ocupacion, capacidad, pct, estado };
}

function calcularEficienciaBloque(){
  const hembras = hembrasActivas().length;
  const enCurso = DB.lotes.filter(l=>!l.fecha_real_destete && l.resultado_palpacion!=='NEGATIVO').length;
  return hembras ? Math.min(100, enCurso/hembras*100) : 0;
}

  const norm = raza.toUpperCase().replace(/\s/g,'');
  if(norm.includes('CAL*NZ') || norm.includes('CAL×NZ')){
    return `${raza}<div class="text-xs" style="color:var(--muted)">Terminal 75% CAL / 25% NZ</div>`;
  }
  return raza;
}

function guardarConejo(idOriginal){
  const id = idOriginal || document.getElementById('f_id').value.trim();
  if(!id){ alert('El ID del conejo es obligatorio.'); return; }
  if(!idOriginal && getConejo(id)){ alert('Ya existe un ejemplar con ese ID.'); return; }

  const datos = {
    id_conejo: id,
    sexo: document.getElementById('f_sexo').value,
    raza: document.getElementById('f_raza').value.trim(),
    categoria_uso: document.getElementById('f_categoria').value,
    id_padre: document.getElementById('f_padre').value || null,
    id_madre: document.getElementById('f_madre').value || null,
    estado_disponibilidad: document.getElementById('f_disp').value,
    estado_productivo: document.getElementById('f_prod').value,
  };

  if(idOriginal){
    const idx = DB.conejos.findIndex(c=>c.id_conejo===idOriginal);
    DB.conejos[idx] = { ...DB.conejos[idx], ...datos };
  } else {
    DB.conejos.push(datos);
  }
  guardarDB();
  cerrarModal();
  renderEjemplares();
  renderPanel();
  toast('Ejemplar guardado');
}

function eliminarConejo(id){
  if(!confirm('¿Eliminar el ejemplar ' + id + '? Esta acción no se puede deshacer.')) return;
  DB.conejos = DB.conejos.filter(c=>c.id_conejo!==id);
  guardarDB();
  cerrarModal();
  renderEjemplares();
  toast('Ejemplar eliminado');
}

  return DB.lotes.find(l=> l.id_hembra===hembraId && l.id_lote!==excluirLoteId && !l.fecha_real_destete && l.resultado_palpacion!=='NEGATIVO');
}

function revisarAvisosForm(){
  const macho = document.getElementById('fl_macho').value;
  const hembra = document.getElementById('fl_hembra').value;
  const el = document.getElementById('consanguinidadAviso');
  let avisos = '';
  if(macho && hembra && checkConsanguinidad(macho, hembra)){
    avisos += `<div class="warn-banner">⚠ <div><strong>Alerta de consanguinidad / cruce no deseado.</strong> Este macho y esta hembra comparten un progenitor o tienen relación directa de parentesco.</div></div>`;
  }
  if(hembra){
    const abierto = loteAbiertoDeHembra(hembra, null);
    if(abierto){
      avisos += `<div class="warn-banner">⚠ <div><strong>Ciclo abierto detectado.</strong> La hembra ${hembra} ya tiene un ciclo sin destetar en el lote <span class="mono">${abierto.id_lote}</span>. Verifica que no sea un duplicado.</div></div>`;
    }
  }
  el.innerHTML = avisos;
}

function guardarLoteNuevo(){
  const id = document.getElementById('fl_id').value.trim();

  if(!id || !macho || !hembra || !fmonta){ alert('Completa lote, macho, hembra y fecha de monta.'); return; }

function guardarDetalleLote(id){
  const l = DB.lotes.find(x=>x.id_lote===id);
  if(!l) return;

  const val = (elId)=> document.getElementById(elId).value;
  const numOrNull = (v)=> v===''? null : Number(v);

  l.fecha_monta = val('d_fmonta') || l.fecha_monta;
  l.fecha_flushing_luminico = val('d_fflushing') || null;
  l.resultado_palpacion = val('d_palpacion');
  l.nido_armado = { hecho: document.getElementById('d_nido_hecho').checked, fecha: document.getElementById('d_nido_fecha').value || null };
  l.fecha_real_parto = val('d_fparto') || null;
  l.nacidos_vivos = numOrNull(val('d_nvivos'));
  l.nacidos_muertos = numOrNull(val('d_nmuertos'));
  l.fecha_real_destete = val('d_fdestete') || null;
  l.cantidad_destetados = numOrNull(val('d_destetados'));
  l.mortalidad_lactancia = numOrNull(val('d_mortalidad'));
  l.comentario = val('d_comentario');
  l.unidad_peso = val('d_unidad');

  ['p1','p2','p3','p4','p5'].forEach(key=>{
    const cant = document.getElementById('pw_cant_'+key).value;
    const peso = document.getElementById('pw_peso_'+key).value;
    l.pesajes[key] = { cantidad: cant===''?null:Number(cant), peso: peso===''?null:Number(peso) };
  });

  // Automatización suave del estado productivo de la hembra
  const hembra = getConejo(l.id_hembra);
  if(hembra){
    if(l.fecha_real_destete) hembra.estado_productivo = 'REPOSO_OBLIGATORIO';
    else if(l.fecha_real_parto) hembra.estado_productivo = 'MATERNIDAD_LACTANTE';
    else if(l.resultado_palpacion === 'POSITIVO') hembra.estado_productivo = 'GESTANTE_CONFIRMADA';
  }

  guardarDB();
  cerrarModal();
  renderLotes();
  renderPanel();
  renderEjemplares();
  toast('Lote actualizado');
}

function eliminarLote(id){
  if(!confirm('¿Eliminar el lote ' + id + '? Esta acción no se puede deshacer.')) return;
  DB.lotes = DB.lotes.filter(l=>l.id_lote!==id);
  guardarDB();
  cerrarModal();
  renderLotes();
  renderPanel();
  toast('Lote eliminado');
}

/* =========================================================
   ESTADÍSTICAS Y DESEMPEÑO
   ========================================================= */
function promedio(arr){ return arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : null; }
function pesoPromedioAnimal(reg){ if(!reg || !reg.cantidad || !reg.peso) return null; return reg.peso/reg.cantidad; }
function n1(v){ return v===null || v===undefined || isNaN(v) ? '—' : v.toFixed(1); }

function statsGlobales(){
  const lotesConParto = DB.lotes.filter(l=>l.fecha_real_parto);
  const lotesConDestete = DB.lotes.filter(l=>l.fecha_real_destete);

  const promVivos = promedio(lotesConParto.map(l=>l.nacidos_vivos||0));
  const promMuertos = promedio(lotesConParto.map(l=>l.nacidos_muertos||0));
  const promDestetados = promedio(lotesConDestete.map(l=>l.cantidad_destetados||0));

  let totalVivos=0, totalMort=0, totalDestetados=0;
  lotesConDestete.forEach(l=>{ totalVivos += l.nacidos_vivos||0; totalMort += l.mortalidad_lactancia||0; totalDestetados += l.cantidad_destetados||0; });
  const tasaMortalidad = totalVivos ? (totalMort/totalVivos*100) : null;
  const tasaDestete = totalVivos ? (totalDestetados/totalVivos*100) : null;

  const pesajesProm = {};
  ['p1','p2','p3','p4','p5'].forEach(key=>{
    const valores = DB.lotes.map(l=>pesoPromedioAnimal(l.pesajes[key])).filter(v=>v!=null);
    pesajesProm[key] = promedio(valores);
  });

  return {
    promVivos, promMuertos, promDestetados, tasaMortalidad, tasaDestete, pesajesProm,
    totalLotes: DB.lotes.length,
    lotesEnCurso: DB.lotes.filter(l=>!l.fecha_real_destete && l.resultado_palpacion!=='NEGATIVO').length,
    machosActivos: machosActivos().length,
    hembrasActivas: hembrasActivas().length,
  };
}

function statsReproductor(id, rolCampo){
  const lotes = DB.lotes.filter(l=> l[rolCampo] === id);
  const conParto = lotes.filter(l=>l.fecha_real_parto);
  const conDestete = lotes.filter(l=>l.fecha_real_destete);
  let vivosAcum=0, mortAcum=0;
  conDestete.forEach(l=>{ vivosAcum += l.nacidos_vivos||0; mortAcum += l.mortalidad_lactancia||0; });
  return {
    totalLotes: lotes.length,
    promVivos: promedio(conParto.map(l=>l.nacidos_vivos||0)),
    promDestetados: promedio(conDestete.map(l=>l.cantidad_destetados||0)),
    mortalidadPct: vivosAcum ? (mortAcum/vivosAcum*100) : null,
    lotes,
  };
}

function barraHtml(label, valor, max, sufijo){
  const pct = (valor!=null && max) ? Math.max(4, (valor/max*100)) : 0;
  return `
    <div class="mb-2">
      <div class="flex justify-between text-xs mb-1"><span style="color:var(--muted)">${label}</span><span class="mono">${valor!=null ? n1(valor)+sufijo : 'Sin datos'}</span></div>
      <div style="background:var(--surface-2); border:1px solid var(--border); border-radius:4px; height:10px;">
        <div style="width:${pct}%; background:var(--primary); height:100%; border-radius:4px;"></div>
      </div>
    </div>`;
}

        <tbody>${tablaMachos || `<tr><td colspan="6" class="text-center py-6" style="color:var(--muted)">Aún no hay machos con lotes registrados.</td></tr>`}</tbody>

/* =========================================================

   ========================================================= */
function toCSV(rows, headers){
  const esc = v => `"${String(v ?? '').replace(/"/g,'""')}"`;
  const lines = [headers.map(h=>esc(h.label)).join(',')];
  rows.forEach(r=> lines.push(headers.map(h=>esc(h.get(r))).join(',')));
  return lines.join('\n');
}
function descargarCSV(nombre, contenido){
  const blob = new Blob(['\ufeff'+contenido], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = nombre; a.click();
  URL.revokeObjectURL(url);
}
function exportarConejosCSV(){

  const nombresPaso = ['Monta dirigida','Palpación','Nido','Pesaje / Cebo'];
  const html = `

          </div>

      <div class="field"><label>Lote</label>
        <select id="sop_lote_nido">
          <option value="">Seleccionar...</option>
          ${candidatos.map(l=>`<option value="${l.id_lote}">${l.id_lote} (${l.id_hembra})</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>Fecha de armado</label><input id="sop_fecha_nido" type="date" value="${todayStr()}"></div>
      <button class="btn btn-primary btn-sm" onclick="confirmarSOPNido()">Marcar nido armado</button>
      <div id="sopConfirm3" class="text-xs mt-2" style="color:var(--primary-dark)"></div>
      ${!candidatos.length ? `<p class="text-sm mt-2" style="color:var(--muted)">No hay lotes pendientes de armado de nido.</p>` : ''}`;
  } else if(sopPaso===4){
    body.innerHTML = `
      <p class="text-sm mb-3" style="color:var(--muted)">Paso 4 — Pesaje y control de cebo. Manipula a los animales con calma, sin estrés etológico.</p>
      <div class="field"><label>Lote</label>
        <select id="sop_lote_peso" onchange="actualizarPesajesSOP()">
          <option value="">Seleccionar...</option>
          ${DB.lotes.map(l=>`<option value="${l.id_lote}">${l.id_lote}</option>`).join('')}
        </select>
      </div>
      <div id="sopPesajeCampos"></div>`;
  }
}

function revisarAvisosSOP(){
  const macho = document.getElementById('sop_macho').value;
  const hembra = document.getElementById('sop_hembra').value;
  const el = document.getElementById('sopAviso');
  let avisos = '';
  if(macho && hembra && checkConsanguinidad(macho, hembra)) avisos += `<div class="warn-banner">⚠ Alerta de consanguinidad detectada en la matriz de reemplazos.</div>`;
  if(hembra){ const abierto = loteAbiertoDeHembra(hembra, null); if(abierto) avisos += `<div class="warn-banner">⚠ La hembra ya tiene un ciclo abierto en el lote ${abierto.id_lote}.</div>`; }
  el.innerHTML = avisos;
}

function confirmarSOPMonta(){
  const id = document.getElementById('sop_id').value.trim();
  const macho = document.getElementById('sop_macho').value;
  const hembra = document.getElementById('sop_hembra').value;
  const fmonta = document.getElementById('sop_fmonta').value;
  const fflushing = document.getElementById('sop_fflushing').value;
  if(!id || !macho || !hembra || !fmonta){ alert('Completa lote, macho, hembra y fecha de monta.'); return; }
  if(DB.lotes.find(l=>l.id_lote===id)){ alert('Ya existe un lote con ese ID.'); return; }
  DB.lotes.push({
    id_lote:id, id_macho:macho, id_hembra:hembra, fecha_monta:fmonta, fecha_flushing_luminico:fflushing||null,
    resultado_palpacion:'PENDIENTE', nacidos_vivos:null, nacidos_muertos:null, fecha_real_parto:null, fecha_real_destete:null,
    cantidad_destetados:null, mortalidad_lactancia:null, nido_armado:{hecho:false,fecha:null}, comentario:'', unidad_peso:'kg',
    pesajes:{p1:{},p2:{},p3:{},p4:{},p5:{}},
  });
  guardarDB();
  sopLoteActivo = id;
  document.getElementById('sopConfirm1').textContent = 'Lote ' + id + ' registrado correctamente.';
  renderTodo();
}

function confirmarSOPPalpacion(){
  const id = document.getElementById('sop_lote_palp').value;
  if(!id){ alert('Selecciona un lote.'); return; }
  const l = DB.lotes.find(x=>x.id_lote===id);
  l.resultado_palpacion = document.getElementById('sop_resultado').value;
  const hembra = getConejo(l.id_hembra);
  if(hembra && l.resultado_palpacion==='POSITIVO') hembra.estado_productivo = 'GESTANTE_CONFIRMADA';
  guardarDB();
  document.getElementById('sopConfirm2').textContent = 'Palpación registrada para ' + id + '.';
  renderTodo();
}

function confirmarSOPNido(){
  const id = document.getElementById('sop_lote_nido').value;
  if(!id){ alert('Selecciona un lote.'); return; }
  const l = DB.lotes.find(x=>x.id_lote===id);
  l.nido_armado = { hecho:true, fecha: document.getElementById('sop_fecha_nido').value || todayStr() };
  guardarDB();
  document.getElementById('sopConfirm3').textContent = 'Nido armado registrado para ' + id + '.';
  renderTodo();
}

function actualizarPesajesSOP(){
  const id = document.getElementById('sop_lote_peso').value;
  const cont = document.getElementById('sopPesajeCampos');
  if(!id){ cont.innerHTML=''; return; }
  const l = DB.lotes.find(x=>x.id_lote===id);
  const f = fechasLote(l);
  const opciones = ['p1','p2','p3','p4','p5'].map(key=>{
    const def = f.pesajes[key];
    const hecho = l.pesajes[key] && (l.pesajes[key].cantidad || l.pesajes[key].peso);
    return `<option value="${key}" ${hecho?'disabled':''}>Pesaje ${def.n} — ${def.label}${hecho?' (ya registrado)':''}</option>`;
  }).join('');
  cont.innerHTML = `
    <div class="field"><label>Pesaje</label><select id="sop_pesaje_key">${opciones}</select></div>
    <div class="grid sm:grid-cols-2 gap-x-4">
      <div class="field"><label>Cantidad de animales</label><input id="sop_pesaje_cant" type="number" min="0"></div>
      <div class="field"><label>Peso total (${l.unidad_peso||'kg'})</label><input id="sop_pesaje_peso" type="number" min="0" step="0.01"></div>
    </div>
    <button class="btn btn-primary btn-sm" onclick="confirmarSOPPesaje('${id}')">Guardar pesaje</button>
    <div id="sopConfirm4" class="text-xs mt-2" style="color:var(--primary-dark)"></div>`;
}

function confirmarSOPPesaje(id){
  const l = DB.lotes.find(x=>x.id_lote===id);
  const key = document.getElementById('sop_pesaje_key').value;
  const cant = document.getElementById('sop_pesaje_cant').value;
  const peso = document.getElementById('sop_pesaje_peso').value;
  l.pesajes[key] = { cantidad: cant===''?null:Number(cant), peso: peso===''?null:Number(peso) };
  guardarDB();
  document.getElementById('sopConfirm4').textContent = 'Pesaje registrado para ' + id + '.';
  renderTodo();
  actualizarPesajesSOP();
}

/* =========================================================
   ETIQUETAS QR (TRAZABILIDAD DE CAMPO)
   ========================================================= */
function abrirEtiquetaQR(tipo, id){
  let titulo, subt, payload;
  if(tipo === 'conejo'){
    const c = getConejo(id);
    if(!c) return;
    titulo = c.id_conejo;
    subt = `${c.sexo==='MACHO'?'Macho':'Hembra'} · ${c.raza||'Genotipo s/d'} · ${labelCategoriaUso(c.categoria_uso)}`;
    payload = `CUNIPIJAOS|CONEJO|${c.id_conejo}`;
  } else {
    const l = DB.lotes.find(x=>x.id_lote===id);
    if(!l) return;
    titulo = l.id_lote;
    subt = `${l.id_macho} × ${l.id_hembra} · Sincronización ${fmt(l.fecha_monta)}`;
    payload = `CUNIPIJAOS|LOTE|${l.id_lote}`;
  }
  const html = `
    <div class="modal-overlay" onclick="if(event.target===this) cerrarModal()">
      <div class="modal-box" style="max-width:360px; text-align:center;">
        <h3 class="font-display text-lg mb-3">Etiqueta de trazabilidad</h3>
        <div id="qrLabelPrint" class="qr-label">
          <div class="mono" style="font-size:1.3rem; font-weight:600;">${titulo}</div>
          <div id="qrCanvas" class="flex justify-center my-3"></div>
          <div class="text-xs" style="color:var(--muted)">${subt}</div>
        </div>
        <div class="flex justify-center gap-2 mt-4">
          <button class="btn btn-outline" onclick="cerrarModal()">Cerrar</button>
          <button class="btn btn-primary" onclick="imprimirEtiquetaQR()">Imprimir etiqueta</button>
        </div>
      </div>
    </div>`;
  document.getElementById('modalRoot').innerHTML = html;
  try{
    new QRCode(document.getElementById('qrCanvas'), { text: payload, width:140, height:140 });
  }catch(e){
    document.getElementById('qrCanvas').innerHTML = '<div class="text-xs" style="color:var(--muted)">No se pudo generar el código QR (revisa tu conexión a internet la primera vez que cargas la página).</div>';
  }
}

function imprimirEtiquetaQR(){
  document.body.classList.add('printing-label');
  window.print();
  setTimeout(()=>document.body.classList.remove('printing-label'), 300);
}

/* =========================================================
   MODAL GENÉRICO
   ========================================================= */
function cerrarModal(){ document.getElementById('modalRoot').innerHTML = ''; }
document.addEventListener('keydown', e=>{ if(e.key==='Escape') cerrarModal(); });

/* =========================================================
   INICIO
   ========================================================= */
cargarDB();
renderTodo();
cambiarTab('panel');
cargarClima();
</script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
  import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDhuvxC7KRtz3LCE6LCrHaBLwTBFnmo4NA",
    authDomain: "cunipijaos.firebaseapp.com",
    projectId: "cunipijaos",
    storageBucket: "cunipijaos.firebasestorage.app",
    messagingSenderId: "424703638105",
    appId: "1:424703638105:web:df85f407290fe2ed0a8f48",
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);
  const refDoc = doc(db, "granjas", "cunipijaos");

  let ultimoJsonRemoto = null; // para no re-renderizar en eco de nuestra propia escritura
  const estadoEl = () => document.getElementById('nubeEstado');

  function marcarEstado(texto, color){
    const el = estadoEl();
    if(el){ el.textContent = texto; el.style.color = color; }
  }

  window.CuniNube = {
    listo: false,
    async subir(dbObjeto){
      try{
        const json = JSON.stringify(dbObjeto);
        ultimoJsonRemoto = json;
        marcarEstado('☁ Sincronizando…', '#E8D9A8');
        await setDoc(refDoc, JSON.parse(json));
        marcarEstado('☁ Sincronizado', '#B7D0BB');
      }catch(e){
        console.error('Error subiendo a Firestore', e);
        marcarEstado('⚠ Sin conexión (guardado local)', '#E0B3A8');
      }
    }
  };

  async function iniciar(){
    try{
      await signInAnonymously(auth);
    }catch(e){
      console.error('Error de autenticación anónima', e);
      marcarEstado('⚠ Firebase no disponible (usando copia local)', '#E0B3A8');
      return;
    }

    try{
      const snap = await getDoc(refDoc);
      if(snap.exists()){
        // Ya hay datos en la nube: se usan como fuente de verdad
        ultimoJsonRemoto = JSON.stringify(snap.data());
        window.reemplazarDBDesdeNube(snap.data());
      } else {
        // Primera vez: se sube lo que ya había localmente en este dispositivo
        const actual = window.obtenerDBActual();
        await setDoc(refDoc, JSON.parse(JSON.stringify(actual)));
        ultimoJsonRemoto = JSON.stringify(actual);
      }
      window.CuniNube.listo = true;
      marcarEstado('☁ Sincronizado', '#B7D0BB');

      onSnapshot(refDoc, (snap)=>{
        if(!snap.exists()) return;
        const json = JSON.stringify(snap.data());
        if(json === ultimoJsonRemoto) return; // es el eco de nuestra propia escritura
        ultimoJsonRemoto = json;
        window.reemplazarDBDesdeNube(snap.data());
        marcarEstado('☁ Actualizado desde otro dispositivo', '#B7D0BB');
      });
    }catch(e){
      console.error('Error conectando a Firestore', e);
      marcarEstado('⚠ Sin conexión (usando copia local)', '#E0B3A8');
    }
  }

  iniciar();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CUNIPIJAOS · Registro cunícola</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #EFE9DC;
    --surface: #FBF8F2;
    --surface-2: #F3EDE0;
    --border: #D9CFB8;
    --text: #2A2620;
    --muted: #786F5C;
    --primary: #3F5B43;
    --primary-dark: #2C4030;
    --primary-light: #6E8A6F;
    --accent: #B5591F;
    --warn: #B4831F;
    --danger: #A13B2A;
    --good: #3F5B43;
  }
  *{box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.font-display{ font-family:'Fraunces', serif; }
  .mono{ font-family:'IBM Plex Mono', monospace; }

  /* ---- Layout shell ---- */
  .app-header{
    background:var(--primary-dark);
    color:#EFE9DC;
    border-bottom:1px solid #1E2E20;
  }
  .app-header .subtitle{ color:#C9D6C6; }
  .ghost-btn{
    border:1px solid rgba(239,233,220,.35);
    color:#EFE9DC;
    background:transparent;
    font-size:.8rem;
    padding:.4rem .7rem;
    border-radius:5px;
    transition:background .15s ease;
  }
  .ghost-btn:hover{ background:rgba(239,233,220,.12); }

  /* ---- Folder-style tabs ---- */
  .tabbar{ display:flex; gap:.25rem; padding:0 1.25rem; border-bottom:1px solid var(--border); background:var(--bg); }
  .tab-btn{
    font-family:'IBM Plex Sans';
    font-size:.92rem;
    padding:.65rem 1.15rem;
    border:1px solid var(--border);
    border-bottom:none;
    border-radius:7px 7px 0 0;
    background:var(--surface-2);
    color:var(--muted);
    position:relative; top:1px;
    cursor:pointer;
  }
  .tab-btn.active{
    background:var(--surface);
    color:var(--primary-dark);
    font-weight:600;
    border-color:var(--border);
    border-bottom:1px solid var(--surface);
  }
  .tab-panel-wrap{
    background:var(--surface);
    border:1px solid var(--border);
    border-top:none;
    border-radius:0 0 8px 8px;
    padding:1.5rem;
    min-height:60vh;
  }

  /* ---- Buttons ---- */
  .btn{
    font-family:'IBM Plex Sans';
    font-weight:500;
    font-size:.9rem;
    padding:.55rem 1rem;
    border-radius:6px;
    cursor:pointer;
    border:1px solid transparent;
    transition:filter .15s ease;
  }
  .btn:hover{ filter:brightness(1.08); }
  .btn-primary{ background:var(--primary); color:#F6F3EB; }
  .btn-outline{ background:transparent; border:1px solid var(--border); color:var(--text); }
  .btn-danger{ background:transparent; border:1px solid var(--danger); color:var(--danger); }
  .btn-sm{ padding:.3rem .6rem; font-size:.78rem; }

  /* ---- Tables ---- */
  table{ width:100%; border-collapse:collapse; font-size:.88rem; }
  thead th{
    text-align:left; font-weight:600; color:var(--muted);
    font-size:.75rem; letter-spacing:.02em;
    padding:.5rem .6rem; border-bottom:1px solid var(--border);
  }
  tbody td{ padding:.55rem .6rem; border-bottom:1px solid var(--border); vertical-align:middle; }
  tbody tr:hover{ background:var(--surface-2); }
  .id-cell{ font-family:'IBM Plex Mono'; font-size:.82rem; color:var(--primary-dark); }

  /* ---- Badges ---- */
  .badge{
    display:inline-flex; align-items:center; gap:.4rem;
    font-size:.74rem; padding:.2rem .55rem;
    border:1px solid var(--border); border-radius:4px; white-space:nowrap;
  }
  .badge .dot{ width:6px; height:6px; border-radius:50%; flex:none; }
  .b-primary .dot{ background:var(--primary); }
  .b-good .dot{ background:var(--good); }
  .b-warn .dot{ background:var(--warn); }
  .b-danger .dot{ background:var(--danger); }
  .b-muted .dot{ background:#9C927A; }

  /* ---- Alert rows ---- */
  .alert-row{
    display:flex; align-items:flex-start; gap:.75rem;
    padding:.6rem .7rem; border:1px solid var(--border); border-left-width:4px;
    border-radius:5px; background:var(--surface); margin-bottom:.5rem;
  }
  .alert-row.atrasado{ border-left-color:var(--danger); }
  .alert-row.hoy{ border-left-color:var(--warn); }
  .alert-row.proximo{ border-left-color:var(--primary); }

  /* ---- Forms ---- */
  label{ font-size:.8rem; color:var(--muted); display:block; margin-bottom:.25rem; }
  input, select, textarea{
    width:100%; border:1px solid var(--border); border-radius:5px;
    padding:.5rem .6rem; font-size:.88rem; background:#fff; color:var(--text);
    font-family:'IBM Plex Sans';
  }
  input:focus, select:focus, textarea:focus{ outline:2px solid var(--primary-light); outline-offset:1px; }
  .field{ margin-bottom:.9rem; }

  /* ---- Modal ---- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(20,18,12,.45);
    display:flex; align-items:flex-start; justify-content:center;
    padding:3vh 1rem; overflow-y:auto; z-index:50;
  }
  .modal-box{
    background:var(--surface); border-radius:10px; border:1px solid var(--border);
    width:100%; max-width:720px; padding:1.5rem 1.6rem 1.75rem;
    box-shadow:0 20px 45px rgba(0,0,0,.18);
  }
  .modal-box.wide{ max-width:920px; }
  .section-title{
    font-family:'Fraunces'; font-size:1.02rem; color:var(--primary-dark);
    border-bottom:1px solid var(--border); padding-bottom:.4rem; margin:1.3rem 0 .8rem;
  }
  .section-title:first-of-type{ margin-top:0; }

  .warn-banner{
    border:1px solid var(--danger); background:#F7E9E5; color:#7A2A1D;
    padding:.6rem .8rem; border-radius:6px; font-size:.85rem; margin-bottom:1rem;
    display:flex; gap:.5rem; align-items:flex-start;
  }

  .readonly-pill{
    font-family:'IBM Plex Mono'; font-size:.82rem; background:var(--surface-2);
    border:1px solid var(--border); border-radius:5px; padding:.5rem .6rem; color:var(--muted);
  }

  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-thumb{ background:#CDC2A6; border-radius:6px; }

  .toast{
    position:fixed; bottom:1.25rem; right:1.25rem; background:var(--primary-dark);
    color:#F6F3EB; padding:.65rem 1rem; border-radius:6px; font-size:.85rem;
    box-shadow:0 8px 24px rgba(0,0,0,.25); z-index:100; opacity:0; transform:translateY(8px);
    transition:all .25s ease; pointer-events:none;
  }
  .toast.show{ opacity:1; transform:translateY(0); }

  @media (max-width:640px){
    .tabbar{ overflow-x:auto; }
    .modal-box{ padding:1.1rem; }
  }
</style>
</head>
<body>

<header class="app-header px-5 py-4 flex items-center justify-between flex-wrap gap-3">
  <div>
    <h1 class="text-xl font-semibold">CUNIPIJAOS</h1>
    <div class="subtitle text-xs">Registro y control cunícola</div>
  </div>
  <div class="flex items-center gap-3 flex-wrap">
    <span class="text-xs subtitle" id="hoyLabel"></span>
    <button class="ghost-btn" onclick="exportarDatos()">Exportar respaldo</button>
    <label class="ghost-btn cursor-pointer">
      Importar respaldo
      <input type="file" accept="application/json" class="hidden" onchange="importarDatos(event)">
    </label>
  </div>
</header>

<nav class="tabbar mt-4" id="tabbar">
  <button class="tab-btn" data-tab="panel" onclick="cambiarTab('panel')">Panel de tareas</button>
  <button class="tab-btn" data-tab="ejemplares" onclick="cambiarTab('ejemplares')">Ejemplares</button>
  <button class="tab-btn" data-tab="lotes" onclick="cambiarTab('lotes')">Ciclos productivos</button>
  <button class="tab-btn" data-tab="estadisticas" onclick="cambiarTab('estadisticas')">Estadísticas</button>
</nav>

<main class="px-1 sm:px-0 max-w-6xl mx-auto pb-16">
  <div class="tab-panel-wrap">
    <section id="tab-panel"></section>
    <section id="tab-ejemplares" class="hidden"></section>
    <section id="tab-lotes" class="hidden"></section>
    <section id="tab-estadisticas" class="hidden"></section>
  </div>
</main>

<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   ESTADO Y PERSISTENCIA
   ========================================================= */
const LS_KEY = 'cunipijaos_v1';
let DB = { conejos: [], lotes: [] };

function datosPorDefecto(){
  return {
    conejos: [
      { id_conejo:'CP_001', sexo:'MACHO',  raza:'MIX HOLANDES', id_padre:null, id_madre:null,   estado_disponibilidad:'BAJA',   estado_productivo:'BAJA_VENTA' },
      { id_conejo:'CP_002', sexo:'MACHO',  raza:'CAL*NZ',       id_padre:null, id_madre:null,   estado_disponibilidad:'ACTIVO', estado_productivo:'LIBRE_DISPONIBLE' },
      { id_conejo:'CP_003', sexo:'MACHO',  raza:'CAL*NZ',       id_padre:null, id_madre:null,   estado_disponibilidad:'ACTIVO', estado_productivo:'LIBRE_DESARROLLO' },
      { id_conejo:'CP_004', sexo:'HEMBRA', raza:'MIX',          id_padre:null, id_madre:null,   estado_disponibilidad:'ACTIVO', estado_productivo:'MATERNIDAD_LACTANTE' },
      { id_conejo:'CP_005', sexo:'HEMBRA', raza:'NZ',           id_padre:null, id_madre:null,   estado_disponibilidad:'ACTIVO', estado_productivo:'LIBRE_DISPONIBLE' },
      { id_conejo:'CP_006', sexo:'HEMBRA', raza:'MIX',          id_padre:null, id_madre:'CP_004', estado_disponibilidad:'ACTIVO', estado_productivo:'LIBRE_DISPONIBLE' },
      { id_conejo:'CP_007', sexo:'HEMBRA', raza:'F1 (NZ*CAL)',  id_padre:null, id_madre:null,   estado_disponibilidad:'ACTIVO', estado_productivo:'GESTANTE_CONFIRMADA' },
    ],
    lotes: [
      {
        id_lote:'L_000', id_macho:'DESCONOCIDO', id_hembra:'CP_004',
        fecha_monta:'2026-07-24', fecha_flushing_luminico:null,
        resultado_palpacion:'POSITIVO',
        nacidos_vivos:null, nacidos_muertos:null,
        fecha_real_parto:null, fecha_real_destete:null,
        cantidad_destetados:null, mortalidad_lactancia:null,
        comentario:'Cruce no deseado, probable venta para carne.',
        unidad_peso:'kg', pesajes:{ p1:{}, p2:{}, p3:{}, p4:{}, p5:{} },
      },
      {
        id_lote:'L_001', id_macho:'CP_002', id_hembra:'CP_007',
        fecha_monta:'2026-08-09', fecha_flushing_luminico:'2026-08-02',
        resultado_palpacion:'POSITIVO',
        nacidos_vivos:null, nacidos_muertos:null,
        fecha_real_parto:null, fecha_real_destete:null,
        cantidad_destetados:null, mortalidad_lactancia:null,
        comentario:'Primer cruce planeado, F1 casi perfecto.',
        unidad_peso:'kg', pesajes:{ p1:{}, p2:{}, p3:{}, p4:{}, p5:{} },
      },
      {
        id_lote:'L_002', id_macho:'CP_002', id_hembra:'CP_006',
        fecha_monta:'2026-09-06', fecha_flushing_luminico:'2026-08-30',
        resultado_palpacion:'POSITIVO',
        nacidos_vivos:null, nacidos_muertos:null,
        fecha_real_parto:null, fecha_real_destete:null,
        cantidad_destetados:null, mortalidad_lactancia:null,
        comentario:'',
        unidad_peso:'kg', pesajes:{ p1:{}, p2:{}, p3:{}, p4:{}, p5:{} },
      },
    ],
  };
}

function cargarDB(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){
      DB = JSON.parse(raw);
    } else {
      DB = datosPorDefecto();
      guardarDB();
    }
  }catch(e){
    console.error('Error leyendo localStorage', e);
    DB = datosPorDefecto();
  }
  DB.conejos = DB.conejos || [];
  DB.lotes = DB.lotes || [];
  DB.lotes.forEach(l=>{ if(!l.pesajes) l.pesajes = { p1:{}, p2:{}, p3:{}, p4:{}, p5:{} }; });
}
function guardarDB(){
  localStorage.setItem(LS_KEY, JSON.stringify(DB));
}

function exportarDatos(){
  const blob = new Blob([JSON.stringify(DB, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'cunipijaos_respaldo_' + todayStr() + '.json';
  a.click();
  URL.revokeObjectURL(url);
  toast('Respaldo descargado');
}
function importarDatos(ev){
  const file = ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const data = JSON.parse(e.target.result);
      if(!confirm('Esto reemplazará todos los datos actuales por los del archivo. ¿Continuar?')) return;
      DB = { conejos: data.conejos || [], lotes: data.lotes || [] };
      DB.lotes.forEach(l=>{ if(!l.pesajes) l.pesajes = { p1:{}, p2:{}, p3:{}, p4:{}, p5:{} }; });
      guardarDB();
      renderTodo();
      toast('Datos importados correctamente');
    }catch(err){
      alert('El archivo no es un respaldo válido de CUNIPIJAOS.');
    }
  };
  reader.readAsText(file);
  ev.target.value = '';
}

/* =========================================================
   UTILIDADES DE FECHA
   ========================================================= */
function todayStr(){ return new Date().toISOString().slice(0,10); }
function addDays(dateStr, days){
  if(!dateStr) return null;
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0,10);
}
function fmt(dateStr){
  if(!dateStr) return '—';
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('es-CO', {day:'2-digit', month:'short', year:'numeric'});
}
function classifyDate(dateStr){
  if(!dateStr) return null;
  const t = todayStr();
  if(dateStr < t) return 'atrasado';
  if(dateStr === t) return 'hoy';
  if(dateStr <= addDays(t,7)) return 'proximo';
  return null;
}
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), 2200);
}

/* =========================================================
   HELPERS DE DATOS
   ========================================================= */
function getConejo(id){ return DB.conejos.find(c=>c.id_conejo === id); }
function machosActivos(){ return DB.conejos.filter(c=>c.sexo==='MACHO' && c.estado_disponibilidad==='ACTIVO'); }
function hembrasActivas(){ return DB.conejos.filter(c=>c.sexo==='HEMBRA' && c.estado_disponibilidad==='ACTIVO'); }

function checkConsanguinidad(machoId, hembraId){
  const macho = getConejo(machoId), hembra = getConejo(hembraId);
  if(!macho || !hembra) return false;
  const padresM = [macho.id_padre, macho.id_madre].filter(Boolean);
  const padresH = [hembra.id_padre, hembra.id_madre].filter(Boolean);
  const comparten = padresM.some(id => padresH.includes(id));
  const esDirecto = padresM.includes(hembra.id_conejo) || padresH.includes(macho.id_conejo);
  return comparten || esDirecto;
}

function nextLoteId(){
  const nums = DB.lotes.map(l=>{ const m = (l.id_lote||'').match(/(\d+)$/); return m ? parseInt(m[1]) : 0; });
  const max = nums.length ? Math.max(...nums) : 0;
  return 'L_' + String(max+1).padStart(3,'0');
}

function fechasLote(l){
  const fPalpacion = addDays(l.fecha_monta, 14);
  const fNido = addDays(l.fecha_monta, 28);
  const fPartoProbable = addDays(l.fecha_monta, 31);
  const baseParto = l.fecha_real_parto || fPartoProbable;
  const fDesteteProgramado = l.fecha_real_parto ? addDays(l.fecha_real_parto, 35) : addDays(l.fecha_monta, 66);
  const pesajes = {
    p1: { n:1, label:'Destete', fecha: addDays(baseParto, 35) },
    p2: { n:2, label:'Segregación de sexos', fecha: addDays(baseParto, 56) },
    p3: { n:3, label:'Control post-traslado', fecha: addDays(baseParto, 70) },
    p4: { n:4, label:'Desaceleración de crecimiento', fecha: addDays(baseParto, 84) },
    p5: { n:5, label:'Certificación del lote', fecha: addDays(baseParto, 98) },
  };
  return { fPalpacion, fNido, fPartoProbable, baseParto, fDesteteProgramado, pesajes };
}

function estadoLote(l){
  if(l.fecha_real_destete) return {label:'Destetado', color:'muted'};
  if(l.fecha_real_parto) return {label:'En lactancia', color:'primary'};
  if(l.resultado_palpacion === 'POSITIVO') return {label:'Gestante confirmada', color:'good'};
  if(l.resultado_palpacion === 'NEGATIVO') return {label:'Monta fallida', color:'danger'};
  if(l.resultado_palpacion === 'DUDOSO') return {label:'Palpación dudosa', color:'warn'};
  return {label:'En espera de palpación', color:'muted'};
}

const ESTADOS_PRODUCTIVOS = [
  ['LIBRE_DISPONIBLE','Libre / disponible'],
  ['MATERNIDAD_LACTANTE','Maternidad — lactante'],
  ['GESTANTE_CONFIRMADA','Gestante confirmada'],
  ['REPOSO_OBLIGATORIO','Reposo obligatorio'],
  ['EN_FLUSHING','En flushing'],
  ['LIBRE_DESARROLLO','Libre — en desarrollo'],
  ['BAJA_VENTA','Baja — venta'],
];
function labelEstadoProductivo(v){ const f = ESTADOS_PRODUCTIVOS.find(x=>x[0]===v); return f ? f[1] : v; }

/* =========================================================
   NAVEGACIÓN DE PESTAÑAS
   ========================================================= */
let tabActual = 'panel';
function cambiarTab(tab){
  tabActual = tab;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  ['panel','ejemplares','lotes','estadisticas'].forEach(t=>{
    document.getElementById('tab-'+t).classList.toggle('hidden', t!==tab);
  });
  if(tab==='panel') renderPanel();
  if(tab==='ejemplares') renderEjemplares();
  if(tab==='lotes') renderLotes();
  if(tab==='estadisticas') renderEstadisticas();
}

function renderTodo(){
  document.getElementById('hoyLabel').textContent = 'Hoy: ' + fmt(todayStr());
  renderPanel();
  renderEjemplares();
  renderLotes();
  renderEstadisticas();
}

/* =========================================================
   PANEL DE TAREAS (ALERTAS)
   ========================================================= */
function generarAlertas(){
  const out = { palpacion:[], nido:[], parto:[], destete:[], pesaje:[] };
  DB.lotes.forEach(l=>{
    const f = fechasLote(l);

    if(!l.resultado_palpacion || l.resultado_palpacion==='PENDIENTE'){
      const cls = classifyDate(f.fPalpacion);
      if(cls) out.palpacion.push({lote:l, fecha:f.fPalpacion, cls});
    }
    if(l.resultado_palpacion !== 'NEGATIVO' && !l.fecha_real_parto){
      let cls = classifyDate(f.fNido);
      if(cls) out.nido.push({lote:l, fecha:f.fNido, cls});
      cls = classifyDate(f.fPartoProbable);
      if(cls) out.parto.push({lote:l, fecha:f.fPartoProbable, cls});
    }
    if(l.fecha_real_parto && !l.fecha_real_destete){
      const cls = classifyDate(f.fDesteteProgramado);
      if(cls) out.destete.push({lote:l, fecha:f.fDesteteProgramado, cls});
    }
    Object.values(f.pesajes).forEach(p=>{
      const registro = l.pesajes[('p'+p.n)] || {};
      const hecho = registro.cantidad || registro.peso;
      if(!hecho){
        const cls = classifyDate(p.fecha);
        if(cls) out.pesaje.push({lote:l, fecha:p.fecha, cls, n:p.n, label:p.label});
      }
    });
  });
  Object.values(out).forEach(arr=>arr.sort((a,b)=>a.fecha.localeCompare(b.fecha)));
  return out;
}

function filaAlerta(texto, item){
  return `
    <div class="alert-row ${item.cls}">
      <div class="flex-1">
        <div class="text-sm">${texto}</div>
        <div class="text-xs" style="color:var(--muted)">Lote <span class="mono">${item.lote.id_lote}</span> · ${fmt(item.fecha)} ${item.cls==='atrasado' ? '· atrasado' : (item.cls==='hoy' ? '· hoy' : '· próximos días')}</div>
      </div>
      <button class="btn btn-outline btn-sm" onclick="irALote('${item.lote.id_lote}')">Ver lote</button>
    </div>`;
}

function bloqueAlertas(titulo, items, renderTexto){
  const cuerpo = items.length
    ? items.map(it=>filaAlerta(renderTexto(it), it)).join('')
    : `<div class="text-sm" style="color:var(--muted)">Sin pendientes por ahora.</div>`;
  return `
    <div class="mb-6">
      <h3 class="text-base font-semibold mb-2" style="color:var(--primary-dark)">${titulo} ${items.length ? `<span class="text-xs font-normal" style="color:var(--muted)">(${items.length})</span>` : ''}</h3>
      ${cuerpo}
    </div>`;
}

function renderPanel(){
  const a = generarAlertas();
  const s = statsGlobales();
  const kpis = [
    ['Machos activos', s.machosActivos],
    ['Hembras activas', s.hembrasActivas],
    ['Lotes en curso', s.lotesEnCurso],
    ['Total de lotes', s.totalLotes],
  ];
  const kpiHtml = `
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6">
      ${kpis.map(([label,val])=>`
        <div class="rounded-md border p-3" style="border-color:var(--border); background:var(--surface-2)">
          <div class="text-2xl font-display" style="color:var(--primary-dark)">${val}</div>
          <div class="text-xs" style="color:var(--muted)">${label}</div>

function guardarConejo(idOriginal){
  const id = idOriginal || document.getElementById('f_id').value.trim();
  if(!id){ alert('El ID del conejo es obligatorio.'); return; }
  if(!idOriginal && getConejo(id)){ alert('Ya existe un ejemplar con ese ID.'); return; }

  const datos = {
    id_conejo: id,
    sexo: document.getElementById('f_sexo').value,
    raza: document.getElementById('f_raza').value.trim(),
    id_padre: document.getElementById('f_padre').value || null,
    id_madre: document.getElementById('f_madre').value || null,
    estado_disponibilidad: document.getElementById('f_disp').value,
    estado_productivo: document.getElementById('f_prod').value,
  };

  if(idOriginal){
    const idx = DB.conejos.findIndex(c=>c.id_conejo===idOriginal);
    DB.conejos[idx] = { ...DB.conejos[idx], ...datos };
  } else {
    DB.conejos.push(datos);
  }
  guardarDB();
  cerrarModal();
  renderEjemplares();
  renderPanel();
  toast('Ejemplar guardado');
}

function eliminarConejo(id){
  if(!confirm('¿Eliminar el ejemplar ' + id + '? Esta acción no se puede deshacer.')) return;
  DB.conejos = DB.conejos.filter(c=>c.id_conejo!==id);
  guardarDB();
  cerrarModal();
  renderEjemplares();
  toast('Ejemplar eliminado');
}

function loteAbiertoDeHembra(hembraId, excluirLoteId){
  return DB.lotes.find(l=> l.id_hembra===hembraId && l.id_lote!==excluirLoteId && !l.fecha_real_destete && l.resultado_palpacion!=='NEGATIVO');
}

function revisarAvisosForm(){
  const macho = document.getElementById('fl_macho').value;
  const hembra = document.getElementById('fl_hembra').value;
  const el = document.getElementById('consanguinidadAviso');
  let avisos = '';
  if(macho && hembra && checkConsanguinidad(macho, hembra)){
    avisos += `<div class="warn-banner">⚠ <div><strong>Alerta de consanguinidad / cruce no deseado.</strong> Este macho y esta hembra comparten un progenitor o tienen relación directa de parentesco.</div></div>`;
  }
  if(hembra){
    const abierto = loteAbiertoDeHembra(hembra, null);
    if(abierto){
      avisos += `<div class="warn-banner">⚠ <div><strong>Ciclo abierto detectado.</strong> La hembra ${hembra} ya tiene un ciclo sin destetar en el lote <span class="mono">${abierto.id_lote}</span>. Verifica que no sea un duplicado.</div></div>`;
    }
  }
  el.innerHTML = avisos;
}

function guardarLoteNuevo(){
  const id = document.getElementById('fl_id').value.trim();
  const macho = document.getElementById('fl_macho').value;
  const hembra = document.getElementById('fl_hembra').value;
  const fmonta = document.getElementById('fl_fmonta').value;
  const fflushing = document.getElementById('fl_fflushing').value;

  if(!id || !macho || !hembra || !fmonta){ alert('Completa lote, macho, hembra y fecha de monta.'); return; }
  if(DB.lotes.find(l=>l.id_lote===id)){ alert('Ya existe un lote con ese ID.'); return; }

  DB.lotes.push({
    id_lote: id, id_macho: macho, id_hembra: hembra,
    fecha_monta: fmonta, fecha_flushing_luminico: fflushing || null,
    resultado_palpacion: 'PENDIENTE',
    nacidos_vivos: null, nacidos_muertos: null,
    fecha_real_parto: null, fecha_real_destete: null,
    cantidad_destetados: null, mortalidad_lactancia: null,
    comentario: '', unidad_peso: 'kg',
    pesajes: { p1:{}, p2:{}, p3:{}, p4:{}, p5:{} },
  });
  guardarDB();
  cerrarModal();
  renderLotes();
  renderPanel();
  toast('Lote creado');
}

            <button class="btn btn-outline" onclick="cerrarModal()">Cerrar</button>
            <button class="btn btn-primary" onclick="guardarDetalleLote('${l.id_lote}')">Guardar cambios</button>
          </div>
        </div>
      </div>
    </div>`;
  document.getElementById('modalRoot').innerHTML = html;
}

function guardarDetalleLote(id){
  const l = DB.lotes.find(x=>x.id_lote===id);
  if(!l) return;

  const val = (elId)=> document.getElementById(elId).value;
  const numOrNull = (v)=> v===''? null : Number(v);

  l.fecha_monta = val('d_fmonta') || l.fecha_monta;
  l.fecha_flushing_luminico = val('d_fflushing') || null;
  l.resultado_palpacion = val('d_palpacion');
  l.fecha_real_parto = val('d_fparto') || null;
  l.nacidos_vivos = numOrNull(val('d_nvivos'));
  l.nacidos_muertos = numOrNull(val('d_nmuertos'));
  l.fecha_real_destete = val('d_fdestete') || null;
  l.cantidad_destetados = numOrNull(val('d_destetados'));
  l.mortalidad_lactancia = numOrNull(val('d_mortalidad'));
  l.comentario = val('d_comentario');
  l.unidad_peso = val('d_unidad');

  ['p1','p2','p3','p4','p5'].forEach(key=>{
    const cant = document.getElementById('pw_cant_'+key).value;
    const peso = document.getElementById('pw_peso_'+key).value;
    l.pesajes[key] = { cantidad: cant===''?null:Number(cant), peso: peso===''?null:Number(peso) };
  });

  // Automatización suave del estado productivo de la hembra
  const hembra = getConejo(l.id_hembra);
  if(hembra){
    if(l.fecha_real_destete) hembra.estado_productivo = 'REPOSO_OBLIGATORIO';
    else if(l.fecha_real_parto) hembra.estado_productivo = 'MATERNIDAD_LACTANTE';
    else if(l.resultado_palpacion === 'POSITIVO') hembra.estado_productivo = 'GESTANTE_CONFIRMADA';
  }

  guardarDB();
  cerrarModal();
  renderLotes();
  renderPanel();
  renderEjemplares();
  toast('Lote actualizado');
}

function eliminarLote(id){
  if(!confirm('¿Eliminar el lote ' + id + '? Esta acción no se puede deshacer.')) return;
  DB.lotes = DB.lotes.filter(l=>l.id_lote!==id);
  guardarDB();
  cerrarModal();
  renderLotes();
  renderPanel();
  toast('Lote eliminado');
}

/* =========================================================
   ESTADÍSTICAS Y DESEMPEÑO
   ========================================================= */
function promedio(arr){ return arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : null; }
function pesoPromedioAnimal(reg){ if(!reg || !reg.cantidad || !reg.peso) return null; return reg.peso/reg.cantidad; }
function n1(v){ return v===null || v===undefined || isNaN(v) ? '—' : v.toFixed(1); }

function statsGlobales(){
  const lotesConParto = DB.lotes.filter(l=>l.fecha_real_parto);
  const lotesConDestete = DB.lotes.filter(l=>l.fecha_real_destete);

  const promVivos = promedio(lotesConParto.map(l=>l.nacidos_vivos||0));
  const promMuertos = promedio(lotesConParto.map(l=>l.nacidos_muertos||0));
  const promDestetados = promedio(lotesConDestete.map(l=>l.cantidad_destetados||0));

  let totalVivos=0, totalMort=0, totalDestetados=0;
  lotesConDestete.forEach(l=>{ totalVivos += l.nacidos_vivos||0; totalMort += l.mortalidad_lactancia||0; totalDestetados += l.cantidad_destetados||0; });
  const tasaMortalidad = totalVivos ? (totalMort/totalVivos*100) : null;
  const tasaDestete = totalVivos ? (totalDestetados/totalVivos*100) : null;

  const pesajesProm = {};
  ['p1','p2','p3','p4','p5'].forEach(key=>{
    const valores = DB.lotes.map(l=>pesoPromedioAnimal(l.pesajes[key])).filter(v=>v!=null);
    pesajesProm[key] = promedio(valores);
  });

  return {
    promVivos, promMuertos, promDestetados, tasaMortalidad, tasaDestete, pesajesProm,
    totalLotes: DB.lotes.length,
    lotesEnCurso: DB.lotes.filter(l=>!l.fecha_real_destete && l.resultado_palpacion!=='NEGATIVO').length,
    machosActivos: machosActivos().length,
    hembrasActivas: hembrasActivas().length,
  };
}

function statsReproductor(id, rolCampo){
  const lotes = DB.lotes.filter(l=> l[rolCampo] === id);
  const conParto = lotes.filter(l=>l.fecha_real_parto);
  const conDestete = lotes.filter(l=>l.fecha_real_destete);
  let vivosAcum=0, mortAcum=0;
  conDestete.forEach(l=>{ vivosAcum += l.nacidos_vivos||0; mortAcum += l.mortalidad_lactancia||0; });
  return {
    totalLotes: lotes.length,
    promVivos: promedio(conParto.map(l=>l.nacidos_vivos||0)),
    promDestetados: promedio(conDestete.map(l=>l.cantidad_destetados||0)),
    mortalidadPct: vivosAcum ? (mortAcum/vivosAcum*100) : null,
    lotes,
  };
}

function barraHtml(label, valor, max, sufijo){
  const pct = (valor!=null && max) ? Math.max(4, (valor/max*100)) : 0;
  return `
    <div class="mb-2">
      <div class="flex justify-between text-xs mb-1"><span style="color:var(--muted)">${label}</span><span class="mono">${valor!=null ? n1(valor)+sufijo : 'Sin datos'}</span></div>
      <div style="background:var(--surface-2); border:1px solid var(--border); border-radius:4px; height:10px;">
        <div style="width:${pct}%; background:var(--primary); height:100%; border-radius:4px;"></div>
      </div>
    </div>`;
}

function renderEstadisticas(){
  const s = statsGlobales();
  const maxPeso = Math.max(0, ...Object.values(s.pesajesProm).filter(v=>v!=null));

  const hembras = DB.conejos.filter(c=>c.sexo==='HEMBRA' && DB.lotes.some(l=>l.id_hembra===c.id_conejo));
  const machos = DB.conejos.filter(c=>c.sexo==='MACHO' && DB.lotes.some(l=>l.id_macho===c.id_conejo));

  const filaReproductor = (c, rolCampo) => {
    const st = statsReproductor(c.id_conejo, rolCampo);
    return `
      <tr>
        <td class="id-cell">${c.id_conejo}</td>
        <td>${st.totalLotes}</td>
        <td>${n1(st.promVivos)}</td>
        <td>${n1(st.promDestetados)}</td>
        <td>${st.mortalidadPct!=null ? n1(st.mortalidadPct)+'%' : '—'}</td>
        <td><button class="btn btn-outline btn-sm" onclick="abrirFichaConejo('${c.id_conejo}')">Ver ficha</button></td>
      </tr>`;
  };

  const tablaHembras = hembras
    .map(c=>({c, st:statsReproductor(c.id_conejo,'id_hembra')}))
    .sort((a,b)=> (b.st.promDestetados||0)-(a.st.promDestetados||0))
    .map(x=>filaReproductor(x.c,'id_hembra')).join('');

  const tablaMachos = machos
    .map(c=>({c, st:statsReproductor(c.id_conejo,'id_macho')}))
    .sort((a,b)=> (b.st.promVivos||0)-(a.st.promVivos||0))
    .map(x=>filaReproductor(x.c,'id_macho')).join('');

  const html = `
    <h2 class="font-display text-2xl mb-1">Estadísticas y desempeño</h2>
    <p class="text-sm mb-6" style="color:var(--muted)">Indicadores calculados a partir de los lotes registrados. Sirven de referencia para decidir qué reproductores mantener.</p>

    <div class="grid sm:grid-cols-3 gap-4 mb-6">
      <div class="rounded-md border p-3" style="border-color:var(--border)">
        <div class="text-xs mb-1" style="color:var(--muted)">Promedio nacidos vivos / parto</div>
        <div class="text-xl font-display" style="color:var(--primary-dark)">${n1(s.promVivos)}</div>
      </div>
      <div class="rounded-md border p-3" style="border-color:var(--border)">
        <div class="text-xs mb-1" style="color:var(--muted)">Tasa de destete</div>
        <div class="text-xl font-display" style="color:var(--primary-dark)">${s.tasaDestete!=null ? n1(s.tasaDestete)+'%' : '—'}</div>
      </div>
      <div class="rounded-md border p-3" style="border-color:var(--border)">
        <div class="text-xs mb-1" style="color:var(--muted)">Mortalidad en lactancia</div>
        <div class="text-xl font-display" style="color:var(--primary-dark)">${s.tasaMortalidad!=null ? n1(s.tasaMortalidad)+'%' : '—'}</div>
      </div>
    </div>

    <div class="section-title">Peso promedio por animal en cada pesaje</div>
    ${barraHtml('Pesaje 1 — Destete', s.pesajesProm.p1, maxPeso, '')}
    ${barraHtml('Pesaje 2 — Segregación de sexos', s.pesajesProm.p2, maxPeso, '')}
    ${barraHtml('Pesaje 3 — Control post-traslado', s.pesajesProm.p3, maxPeso, '')}
    ${barraHtml('Pesaje 4 — Desaceleración de crecimiento', s.pesajesProm.p4, maxPeso, '')}
    ${barraHtml('Pesaje 5 — Certificación del lote', s.pesajesProm.p5, maxPeso, '')}

    <div class="section-title">Desempeño de hembras reproductoras</div>
    <div class="overflow-x-auto mb-6">
      <table>
        <thead><tr><th>ID</th><th>Lotes</th><th>Prom. nacidos vivos</th><th>Prom. destetados</th><th>Mortalidad lactancia</th><th></th></tr></thead>
        <tbody>${tablaHembras || `<tr><td colspan="6" class="text-center py-6" style="color:var(--muted)">Aún no hay hembras con lotes registrados.</td></tr>`}</tbody>
      </table>
    </div>

    <div class="section-title">Desempeño de machos reproductores</div>
    <div class="overflow-x-auto">
      <table>
        <thead><tr><th>ID</th><th>Lotes</th><th>Prom. nacidos vivos</th><th>Prom. destetados</th><th>Mortalidad lactancia</th><th></th></tr></thead>
        <tbody>${tablaMachos || `<tr><td colspan="6" class="text-center py-6" style="color:var(--muted)">Aún no hay machos con lotes registrados.</td></tr>`}</tbody>
      </table>
    </div>
  `;
  document.getElementById('tab-estadisticas').innerHTML = html;
}

    .slice().sort((a,b)=> (a.fecha_monta||'').localeCompare(b.fecha_monta||''))

        <p class="text-sm mb-4" style="color:var(--muted)">${c.sexo==='MACHO'?'Macho':'Hembra'} · ${c.raza||'Raza no registrada'} · ${labelEstadoProductivo(c.estado_productivo)}</p>

          <div class="rounded-md border p-3" style="border-color:var(--border)">
            <div class="text-xs" style="color:var(--muted)">Lotes participados</div>
            <div class="text-lg font-display" style="color:var(--primary-dark)">${st.totalLotes}</div>
          </div>
          <div class="rounded-md border p-3" style="border-color:var(--border)">
            <div class="text-xs" style="color:var(--muted)">Prom. nacidos vivos</div>
            <div class="text-lg font-display" style="color:var(--primary-dark)">${n1(st.promVivos)}</div>
          </div>
          <div class="rounded-md border p-3" style="border-color:var(--border)">
            <div class="text-xs" style="color:var(--muted)">Prom. destetados</div>

        <div class="flex justify-end gap-2 mt-5">
          <button class="btn btn-outline" onclick="cerrarModal()">Cerrar</button>

        </div>
      </div>
    </div>`;
  document.getElementById('modalRoot').innerHTML = html;
}

/* =========================================================
   EXPORTACIÓN A CSV
   ========================================================= */
function toCSV(rows, headers){
  const esc = v => `"${String(v ?? '').replace(/"/g,'""')}"`;
  const lines = [headers.map(h=>esc(h.label)).join(',')];
  rows.forEach(r=> lines.push(headers.map(h=>esc(h.get(r))).join(',')));
  return lines.join('\n');
}
function descargarCSV(nombre, contenido){
  const blob = new Blob(['\ufeff'+contenido], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = nombre; a.click();
  URL.revokeObjectURL(url);
}
function exportarConejosCSV(){

  ];
